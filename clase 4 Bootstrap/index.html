<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase: Componentes Básicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light"> <div class="container my-5">
    <div class="bg-secondary bg-opacity-25 p-4 rounded-4 shadow-lg border border-secondary">
      
      <h2 class="mb-4 text-info">Panel de Control</h2> <div class="alert alert-warning border-0 shadow-sm" role="alert">
        Tienes <strong>3 mensajes</strong> nuevos en tu bandeja de entrada.
      </div>
      
      <div class="alert alert-primary alert-dismissible fade show border-0 shadow-sm" role="alert">
        ¡Tu perfil se ha actualizado correctamente!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      
      <hr class="my-4 border-secondary">

      <div class="mb-4">
        <h4 class="d-inline-block me-2">Mensajes</h4>
        <span class="badge bg-secondary">12</span> <span class="badge rounded-pill bg-info text-dark">Nuevo</span> <span class="badge bg-dark border border-warning text-warning">Pendiente</span> </div>
      
      <hr class="my-4 border-secondary">
      
      <div class="d-grid gap-2 d-md-block">
        <button class="btn btn-success px-4" type="button">Enviar Reporte</button>
        
        <button class="btn btn-outline-light px-4" type="button">Cancelar</button>
        
        <button class="btn btn-outline-danger px-4" type="button">
          Eliminar <span class="badge bg-danger text-white ms-1">5</span>
        </button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
